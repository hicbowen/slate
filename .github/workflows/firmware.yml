name: firmware

on:
  push:
    branches: [master]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

jobs:
  build:
    name: ESP-IDF build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: ESP-IDF build (Note4 + Note4C)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: 'v5.5.2'
          target: esp32s3
          path: 'firmware'
          command: >-
            idf.py -B build-note4 -D SDKCONFIG=build-note4/sdkconfig -D SDKCONFIG_DEFAULTS=sdkconfig.defaults build &&
            idf.py -B build-note4 merge-bin -o slate-note4-full.bin &&
            cp build-note4/slate.bin build-note4/slate-note4-ota.bin &&
            idf.py -B build-note4c -D SDKCONFIG=build-note4c/sdkconfig -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.note4c.defaults' build &&
            idf.py -B build-note4c merge-bin -o slate-note4c-full.bin &&
            cp build-note4c/slate.bin build-note4c/slate-note4c-ota.bin

      - name: upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware-note4-note4c
          path: |
            firmware/build-note4/slate-note4-full.bin
            firmware/build-note4/slate-note4-ota.bin
            firmware/build-note4c/slate-note4c-full.bin
            firmware/build-note4c/slate-note4c-ota.bin
          if-no-files-found: error
          retention-days: 14
